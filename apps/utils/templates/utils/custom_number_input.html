{% load custom_tags %}
{% if 'min' in widget.attrs %}<span class="range-input-left">{{ widget.attrs|get_item:'min' }}</span>{% endif %}<input type="range" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}{% if 'class' in widget.attrs %} class="custom-range {{ widget.attrs|get_item:'class' }}"{% else %} class="custom-range"{% endif %}{% for name, value in widget.attrs.items %}{% if name != 'class' and value is not False %} {{ name }}{% if value is not True %}="{{ value|stringformat:'s' }}"{% endif %}{% endif %}{% endfor %}>{% if 'max' in widget.attrs %}<span class="range-input-right">{{ widget.attrs|get_item:'max' }}</span>{% endif %}
<output class="bubble"></output>
