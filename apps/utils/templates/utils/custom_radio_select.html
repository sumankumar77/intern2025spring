{% with id=widget.attrs.id %}<div{% if id %} id="{{ id }}"{% endif %} class="custom-radio-select{% if widget.attrs.class %} {{ widget.attrs.class }}{% endif %}">{% for group, options, index in widget.optgroups %}{% if group %}
  <div><label>{{ group }}</label>{% endif %}{% for option in options %}
    {% include option.template_name with widget=option %}{% endfor %}{% if group %}
  </div>{% endif %}{% endfor %}
</div>{% endwith %}
