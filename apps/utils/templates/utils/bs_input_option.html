<div class="form-check">
  <input class="form-check-input{% for name, value in widget.attrs.items %}{% if name == "class" and value is not True %} {{ value|stringformat:'s' }}{% endif %}{% endfor %}"
         type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}
      {% for name, value in widget.attrs.items %}
        {% if name != "class" %}
          {% if value is not False %} {{ name }}{% if value is not True %}="{{ value|stringformat:'s' }}"{% endif %}{% endif %}
        {% endif %}
      {% endfor %}>
  {% if widget.wrap_label %}
    <label class="form-check-label"{% if widget.attrs.id %} for="{{ widget.attrs.id }}"{% endif %}>{{ widget.label }}</label>
  {% endif %}
</div>
